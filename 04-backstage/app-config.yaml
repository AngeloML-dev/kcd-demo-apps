# KCD Peru 2026 — Backstage config
# SQLite en memoria + guest auth (perfecto para demos)
app:
  title: KCD Peru 2026 — Platform
  baseUrl: http://localhost:3000

organization:
  name: KCD Peru 2026

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

catalog:
  import:
    entityFilename: catalog-info.yaml
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    # Paths relativos a packages/backend/ (donde corre el backend de Backstage)
    - type: file
      target: ../../../templates/microservice/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../../templates/api-with-database/template.yaml
      rules:
        - allow: [Template]