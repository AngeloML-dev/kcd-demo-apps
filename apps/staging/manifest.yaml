# Generado por Backstage Software Template
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apple
  namespace: staging
  labels:
    app: apple
    managed-by: backstage-scaffolder
    environment: staging
    owner: backend-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apple
  template:
    metadata:
      labels:
        app: apple
        environment: staging
    spec:
      containers:
        - name: apple
          image: nginx:alpine
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: apple
  namespace: staging
  labels:
    app: apple
    managed-by: backstage-scaffolder
spec:
  selector:
    app: apple
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apple
  namespace: staging
  labels:
    app: apple
    managed-by: backstage-scaffolder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apple
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
