# Generado por Backstage Software Template
# API + PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omc
  namespace: staging
  labels:
    app: omc
    managed-by: backstage-scaffolder
    environment: staging
    owner: backend-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omc
  template:
    metadata:
      labels:
        app: omc
        environment: staging
    spec:
      containers:
        - name: omc
          image: nginx:alpine
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://appuser:kcd-demo-pass@omc-db:5432/omc"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: omc
  namespace: staging
  labels:
    app: omc
    managed-by: backstage-scaffolder
spec:
  selector:
    app: omc
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
# PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omc-db
  namespace: staging
  labels:
    app: omc-db
    managed-by: backstage-scaffolder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omc-db
  template:
    metadata:
      labels:
        app: omc-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_DB
              value: omc
            - name: POSTGRES_USER
              value: appuser
            - name: POSTGRES_PASSWORD
              value: kcd-demo-pass
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: omc-db
  namespace: staging
spec:
  selector:
    app: omc-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omc
  namespace: staging
  labels:
    app: omc
    managed-by: backstage-scaffolder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omc
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
