# Perfil liviano para Windows + WSL2 con 16 GB de RAM.
# Un unico control-plane es suficiente para la demo y reduce la memoria de Docker.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kcd-demo
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
