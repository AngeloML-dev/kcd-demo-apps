# Generado por Backstage Software Template
# API + PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.service_name }}
  namespace: ${{ values.environment }}
  labels:
    app: ${{ values.service_name }}
    managed-by: backstage-scaffolder
    environment: ${{ values.environment }}
    owner: ${{ values.owner }}
spec:
  replicas: ${{ values.replicas }}
  selector:
    matchLabels:
      app: ${{ values.service_name }}
  template:
    metadata:
      labels:
        app: ${{ values.service_name }}
        environment: ${{ values.environment }}
    spec:
      containers:
        - name: ${{ values.service_name }}
          image: nginx:alpine
          ports:
            - containerPort: ${{ values.port }}
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://appuser:kcd-demo-pass@${{ values.service_name }}-db:5432/${{ values.service_name }}"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.service_name }}
  namespace: ${{ values.environment }}
  labels:
    app: ${{ values.service_name }}
    managed-by: backstage-scaffolder
spec:
  selector:
    app: ${{ values.service_name }}
  ports:
    - name: http
      port: 80
      targetPort: ${{ values.port }}
  type: ClusterIP
---
# PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.service_name }}-db
  namespace: ${{ values.environment }}
  labels:
    app: ${{ values.service_name }}-db
    managed-by: backstage-scaffolder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ values.service_name }}-db
  template:
    metadata:
      labels:
        app: ${{ values.service_name }}-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_DB
              value: ${{ values.service_name }}
            - name: POSTGRES_USER
              value: appuser
            - name: POSTGRES_PASSWORD
              value: kcd-demo-pass
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.service_name }}-db
  namespace: ${{ values.environment }}
spec:
  selector:
    app: ${{ values.service_name }}-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${{ values.service_name }}
  namespace: ${{ values.environment }}
  labels:
    app: ${{ values.service_name }}
    managed-by: backstage-scaffolder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${{ values.service_name }}
  minReplicas: ${{ values.replicas }}
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
